<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">FACRI 具身协作系统全栈四层与快慢双回路矢量蓝图</title>
  <desc id="diagram-desc">展示 SystemApp 编排层、ROS 2 V2–V5 与 StarFleetBus 通信层、RobotApp C++20 4+1 多进程层、IHalDriver 与 FacilityHAL 物理层，以及左侧慢速 RSI 演化回路与右侧 200 Hz 实时物理控制回路。</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#16181D"/>
    </marker>
    <marker id="arrow-terracotta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#B04A1A"/>
    </marker>
    <marker id="arrow-forest" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2C5E3F"/>
    </marker>
  </defs>

  <style>
    .bg-paper { fill: #FAFAF7; }
    .panel { fill: #F3F0E8; stroke: #E2DDD4; stroke-width: 1.5; }
    .card { fill: #FAFAF7; stroke: #D8D3C8; stroke-width: 1.25; }
    .card-accent { fill: #FFF7F2; stroke: #B04A1A; stroke-width: 1.4; }
    .card-rt { fill: #F4F8F5; stroke: #2C5E3F; stroke-width: 1.4; }
    .title { font-family: "Noto Serif SC", "Source Han Serif SC", Georgia, serif; font-size: 20px; font-weight: 700; fill: #16181D; }
    .tier-tag { font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 600; fill: #B04A1A; letter-spacing: 0.08em; }
    .tier-tag-rt { font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 600; fill: #2C5E3F; letter-spacing: 0.08em; }
    .tier-name { font-family: "Inter", "PingFang SC", "Noto Sans SC", sans-serif; font-size: 15px; font-weight: 700; fill: #16181D; }
    .box-title { font-family: "Inter", "PingFang SC", "Noto Sans SC", sans-serif; font-size: 13px; font-weight: 700; fill: #16181D; }
    .box-mono { font-family: "JetBrains Mono", monospace; font-size: 11px; fill: #4F545E; }
    .box-note { font-family: "Inter", "PingFang SC", "Noto Sans SC", sans-serif; font-size: 11.5px; fill: #4F545E; }
    .loop-title-slow { font-family: "Inter", "PingFang SC", "Noto Sans SC", sans-serif; font-size: 13px; font-weight: 700; fill: #B04A1A; }
    .loop-title-fast { font-family: "Inter", "PingFang SC", "Noto Sans SC", sans-serif; font-size: 13px; font-weight: 700; fill: #2C5E3F; }
    .axis-label { font-family: "JetBrains Mono", monospace; font-size: 11px; fill: #16181D; }
    .edge-ink { stroke: #16181D; stroke-width: 1.5; fill: none; marker-end: url(#arrow-ink); }
    .edge-slow { stroke: #B04A1A; stroke-width: 1.75; fill: none; marker-end: url(#arrow-terracotta); }
    .edge-slow-dash { stroke: #B04A1A; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow-terracotta); }
    .edge-fast { stroke: #2C5E3F; stroke-width: 1.75; fill: none; marker-end: url(#arrow-forest); }
    .rule-line { stroke: #E2DDD4; stroke-width: 1; }
  </style>

  <!-- Canvas -->
  <rect class="bg-paper" x="0" y="0" width="1240" height="720"/>

  <!-- Header -->
  <text class="tier-tag" x="40" y="34">ARCHITECTURE MANIFESTO · FACRI v2.0.8</text>
  <text class="title" x="40" y="60">四层解耦契约与快慢双回路控制拓扑</text>
  <text class="box-note" x="920" y="58">4+1 C++20 · 9 构型 · 0x454D4553 · 200 Hz RT</text>
  <line class="rule-line" x1="40" y1="74" x2="1200" y2="74"/>

  <!-- Left Rail: Slow RSI & Semantic Loop -->
  <rect class="card-accent" x="40" y="96" width="176" height="584" rx="2"/>
  <text class="tier-tag" x="56" y="122">SLOW LOOP · 1–10 s</text>
  <text class="loop-title-slow" x="56" y="144">语义编排与真实</text>
  <text class="loop-title-slow" x="56" y="162">RSI 经验演化回路</text>
  <line class="rule-line" x1="56" y1="176" x2="200" y2="176"/>

  <rect class="card" x="56" y="196" width="144" height="74" rx="2"/>
  <text class="box-title" x="68" y="218">1. 真实执行证据</text>
  <text class="box-mono" x="68" y="236">EvidenceStore</text>
  <text class="box-note" x="68" y="254">V0 FAIL → V1 PASS</text>

  <rect class="card" x="56" y="294" width="144" height="74" rx="2"/>
  <text class="box-title" x="68" y="316">2. 只读诊断反思</text>
  <text class="box-mono" x="68" y="334">ReflectionEngine</text>
  <text class="box-note" x="68" y="352">ModelGateway 18080</text>

  <rect class="card" x="56" y="392" width="144" height="74" rx="2"/>
  <text class="box-title" x="68" y="414">3. 版本评估采纳</text>
  <text class="box-mono" x="68" y="432">EvolutionManager</text>
  <text class="box-note" x="68" y="450">L1–L3 离线核验</text>

  <rect class="card" x="56" y="490" width="144" height="74" rx="2"/>
  <text class="box-title" x="68" y="512">4. 技能契约生效</text>
  <text class="box-mono" x="68" y="530">configs/skills/*</text>
  <text class="box-note" x="68" y="548">SkillCatalog SHA</text>

  <text class="box-note" x="56" y="600">严禁绕过契约层</text>
  <text class="box-note" x="56" y="618">直写底层关节指令</text>
  <text class="box-mono" x="56" y="646">0.0002 s GIL 隔离</text>
  <text class="box-mono" x="56" y="664">18640 恒为只读观察</text>

  <path class="edge-slow" d="M 128 270 L 128 292"/>
  <path class="edge-slow" d="M 128 368 L 128 390"/>
  <path class="edge-slow" d="M 128 466 L 128 488"/>
  <path class="edge-slow-dash" d="M 200 527 L 230 527 L 230 162 L 244 162"/>

  <!-- Center Stack: 4 Tiers (x=246 to x=994, width=748) -->

  <!-- Tier 1: SystemApp -->
  <rect class="panel" x="246" y="96" width="748" height="140" rx="2"/>
  <text class="tier-tag" x="264" y="118">TIER 01 · SYSTEM ORCHESTRATION</text>
  <text class="tier-name" x="520" y="118">SystemApp（12 模块 · 秒级任务编排与验证）</text>

  <rect class="card" x="264" y="132" width="166" height="88" rx="2"/>
  <text class="box-title" x="276" y="154">TeamPlanner</text>
  <text class="box-mono" x="276" y="172">5D CapabilityPlanner</text>
  <text class="box-note" x="276" y="192">Skill 编译与多机分工</text>
  <text class="box-mono" x="276" y="208">NEEDS_CLARIFICATION</text>

  <rect class="card" x="444" y="132" width="166" height="88" rx="2"/>
  <text class="box-title" x="456" y="154">TeamRuntime</text>
  <text class="box-mono" x="456" y="172">CapabilityRegistry</text>
  <text class="box-note" x="456" y="192">去重派发与租约协调</text>
  <text class="box-mono" x="456" y="208">ContextStore / Memory</text>

  <rect class="card" x="624" y="132" width="166" height="88" rx="2"/>
  <text class="box-title" x="636" y="154">TeamVerifier</text>
  <text class="box-mono" x="636" y="172">GoalPredicate</text>
  <text class="box-note" x="636" y="192">逐目标独立谓词核验</text>
  <text class="box-mono" x="636" y="208">EquipmentRuntime</text>

  <rect class="card" x="804" y="132" width="172" height="88" rx="2"/>
  <text class="box-title" x="816" y="154">Interaction &amp; UI</text>
  <text class="box-mono" x="816" y="172">InteractionRuntime</text>
  <text class="box-note" x="816" y="192">ASR / TTS / 语音流</text>
  <text class="box-mono" x="816" y="208">Gateway :18080 / :18640</text>

  <!-- Tier 2: Contracts & Transport -->
  <rect class="card" x="246" y="258" width="748" height="86" rx="2"/>
  <text class="tier-tag" x="264" y="280">TIER 02 · TYPED CONTRACTS &amp; BUS</text>
  <text class="tier-name" x="520" y="280">版本化契约边界（零语义越权）</text>

  <rect class="panel" x="264" y="292" width="172" height="40" rx="2"/>
  <text class="box-mono" x="274" y="310">ROS 2 V2–V5 IDL</text>
  <text class="box-note" x="274" y="325">56 msg · 22 srv · 6 act</text>

  <rect class="panel" x="448" y="292" width="172" height="40" rx="2"/>
  <text class="box-mono" x="458" y="310">StarFleetBus</text>
  <text class="box-note" x="458" y="325">任务队列 / 资源令牌互斥</text>

  <rect class="panel" x="632" y="292" width="172" height="40" rx="2"/>
  <text class="box-mono" x="642" y="310">EmbodimentSpecPod</text>
  <text class="box-note" x="642" y="325">0x454D4553 · CRC32</text>

  <rect class="panel" x="816" y="292" width="160" height="40" rx="2"/>
  <text class="box-mono" x="826" y="310">SafetyFrame UDP</text>
  <text class="box-note" x="826" y="325">32B · 0x454D5346 · 急停</text>

  <!-- Tier 3: RobotApp C++20 4+1 -->
  <rect class="panel" x="246" y="366" width="748" height="176" rx="2"/>
  <text class="tier-tag-rt" x="264" y="388">TIER 03 · ROBOTAPP C++20 4+1 RUNTIME</text>
  <text class="tier-name" x="560" y="388">单机多进程隔离（14 模块 · 无锁 /dev/shm/embodied_ipc/*）</text>

  <!-- Supervisor bar -->
  <rect class="card" x="264" y="400" width="712" height="36" rx="2"/>
  <text class="box-title" x="276" y="422">robot_supervisor</text>
  <text class="box-mono" x="412" y="422" style="font-size:10.5px">TopologyProbe · ProportionalResourceAllocator · CapabilitySynthesizer (L1 ∧ HAL ∧ L2)</text>

  <!-- 4 Worker processes -->
  <rect class="card-rt" x="264" y="446" width="168" height="82" rx="2"/>
  <text class="box-title" x="276" y="466">robot_body_rt</text>
  <text class="box-mono" x="276" y="483">200 Hz SCHED_FIFO</text>
  <text class="box-note" x="276" y="500">mlockall · 零重启保护</text>
  <text class="box-mono" x="276" y="516">Policy / Admittance</text>

  <rect class="card" x="446" y="446" width="168" height="82" rx="2"/>
  <text class="box-title" x="458" y="466">robot_motion_plan</text>
  <text class="box-mono" x="458" y="483">PlanningCore</text>
  <text class="box-note" x="458" y="500">49 候选 DLS IK · C2</text>
  <text class="box-mono" x="458" y="516">box_route / Sampling</text>

  <rect class="card" x="628" y="446" width="168" height="82" rx="2"/>
  <text class="box-title" x="640" y="466">robot_spatial_perc</text>
  <text class="box-mono" x="640" y="483">LiDAR + RGB-D</text>
  <text class="box-note" x="640" y="500">动态腰部 FK 补偿</text>
  <text class="box-mono" x="640" y="516">VoxelICP / ROI</text>

  <rect class="card" x="810" y="446" width="166" height="82" rx="2"/>
  <text class="box-title" x="822" y="466">robot_task_agent</text>
  <text class="box-mono" x="822" y="483">LocalTaskRuntime</text>
  <text class="box-note" x="822" y="500">能力路由 / 证据缓冲</text>
  <text class="box-mono" x="822" y="516">ConfigClient</text>

  <!-- Tier 4: IHalDriver & FacilityHAL -->
  <rect class="panel" x="246" y="564" width="748" height="116" rx="2"/>
  <text class="tier-tag-rt" x="264" y="586">TIER 04 · SYMMETRIC HAL / SAL BOUNDARY</text>
  <text class="tier-name" x="560" y="586">双域对称物理层（SIM 与 REAL 共用同一控制栈）</text>

  <rect class="card-rt" x="264" y="598" width="232" height="68" rx="2"/>
  <text class="box-title" x="276" y="618">IHalDriver · 6 个 .so 插件</text>
  <text class="box-mono" x="276" y="636" style="font-size:10.5px">sal_shm · hal_facri · hal_g2</text>
  <text class="box-mono" x="276" y="652" style="font-size:10.5px">hal_m20 · hal_rp1 · hal_ugv_can</text>

  <rect class="card" x="510" y="598" width="232" height="68" rx="2"/>
  <text class="box-title" x="522" y="618">SalWire v2 + FastDDS 126</text>
  <text class="box-mono" x="522" y="636">Sample 1472B · Cmd 2052B</text>
  <text class="box-note" x="522" y="652">MuJoCo 4.0.1 condim=6 纯接触</text>

  <rect class="card" x="756" y="598" width="220" height="68" rx="2"/>
  <text class="box-title" x="768" y="618">FacilityHAL HTTP 网关</text>
  <text class="box-mono" x="768" y="636">src/facility_hal/</text>
  <text class="box-note" x="768" y="652">MuJoCo / Modbus PLC / Mockup</text>

  <!-- Vertical Connectors between Tiers -->
  <path class="edge-ink" d="M 480 236 L 480 256"/>
  <path class="edge-ink" d="M 720 256 L 720 238"/>
  <path class="edge-ink" d="M 480 344 L 480 364"/>
  <path class="edge-ink" d="M 720 364 L 720 346"/>
  <path class="edge-fast" d="M 380 542 L 380 562"/>
  <path class="edge-fast" d="M 620 562 L 620 544"/>

  <!-- Right Rail: Fast 200 Hz RT Loop -->
  <rect class="card-rt" x="1018" y="96" width="182" height="584" rx="2"/>
  <text class="tier-tag-rt" x="1034" y="122">FAST LOOP · 200 Hz</text>
  <text class="loop-title-fast" x="1034" y="144">确定性实时物理控制</text>
  <text class="loop-title-fast" x="1034" y="162">与安全防护回路</text>
  <line class="rule-line" x1="1034" y1="176" x2="1184" y2="176"/>

  <rect class="card" x="1034" y="196" width="150" height="78" rx="2"/>
  <text class="box-title" x="1046" y="218">1. 状态采样 (5 ms)</text>
  <text class="box-mono" x="1046" y="236">SalSampleWire v2</text>
  <text class="box-note" x="1046" y="254">1472 B · 源时间戳</text>

  <rect class="card" x="1034" y="296" width="150" height="78" rx="2"/>
  <text class="box-title" x="1046" y="318">2. 策略与导纳</text>
  <text class="box-mono" x="1046" y="336">50 Hz Policy + IK</text>
  <text class="box-note" x="1046" y="354">WrenchObserver</text>

  <rect class="card" x="1034" y="396" width="150" height="78" rx="2"/>
  <text class="box-title" x="1046" y="418">3. 本地保护仲裁</text>
  <text class="box-mono" x="1046" y="436">ProtectionCore</text>
  <text class="box-note" x="1046" y="454">急停位掩码 + 单机隔离</text>

  <rect class="card" x="1034" y="496" width="150" height="78" rx="2"/>
  <text class="box-title" x="1046" y="518">4. 执行下发</text>
  <text class="box-mono" x="1046" y="536">SalCommandWire v2</text>
  <text class="box-note" x="1046" y="554">2052 B · CRC32</text>

  <text class="box-note" x="1034" y="600">高层语义永不阻塞</text>
  <text class="box-note" x="1034" y="618">200 Hz 物理周期</text>
  <text class="box-mono" x="1034" y="646">9 类声明式构型零分叉</text>
  <text class="box-mono" x="1034" y="664">L0–L4 证据阶梯验证</text>

  <path class="edge-fast" d="M 1109 274 L 1109 294"/>
  <path class="edge-fast" d="M 1109 374 L 1109 394"/>
  <path class="edge-fast" d="M 1109 474 L 1109 494"/>
  <path class="edge-fast" d="M 1034 535 L 996 535"/>

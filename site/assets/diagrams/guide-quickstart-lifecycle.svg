  <text x="428.0" y="494.0" font-family="&quot;Inter&quot;, &quot;PingFang SC&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="12.5" font-weight="700" fill="#16181D">路径 A · ./facrictl stop（安全停车）</text>
  <text x="428.0" y="510.0" font-family="&quot;Inter&quot;, &quot;PingFang SC&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.8" font-weight="400" fill="#434853">下发安全停车信号，中止运动与任务派发</text>
  <text x="428.0" y="525.5" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="10.2" font-weight="500" fill="#434853">容器保留 · :18640 只读视图与日志可查</text>

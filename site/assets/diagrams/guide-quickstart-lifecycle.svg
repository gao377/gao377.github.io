  <text x="804.0" y="510.0" font-family="&quot;Inter&quot;, &quot;PingFang SC&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.8" font-weight="400" fill="#434853">完成会话结算，销毁并发容器与 /dev/shm</text>

  <text x="64.0" y="541.0" font-family="&quot;Inter&quot;, &quot;PingFang SC&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.8" font-weight="400" fill="#434853">按真实失败保留计数，不重跑篡改旧 case</text>

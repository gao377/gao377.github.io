  <title id="diagram-title">facrictl 单会话生命周期与五步启停状态流转</title>
  <desc id="diagram-desc">展示 facrictl 统一 CLI 路由至三条部署后端，以及五步标准启停和 stop 与 close --wait 的资源锁状态差异。</desc>

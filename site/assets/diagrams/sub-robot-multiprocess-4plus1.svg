  <text x="820.0" y="170.0" font-family="&quot;Inter&quot;, &quot;PingFang SC&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.8" font-weight="400" fill="#434853">P1–P3 退出 80 ms 退避重启</text>

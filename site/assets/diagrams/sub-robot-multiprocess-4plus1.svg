<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">端侧 C++20 4+1 多进程、TopologyProbe 与无锁 SHM IPC 拓扑</title>
  <desc id="diagram-desc">展示单机 robot_supervisor 硬件核组探测与比例资源分配、P0–P3 四个独立进程线程节拍，以及 /dev/shm/embodied_ipc/* 无锁共享内存布局。</desc>

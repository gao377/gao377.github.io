  <text x="424.0" y="185.5" font-family="&quot;Inter&quot;, &quot;PingFang SC&quot;, &quot;Noto Sans SC&quot;, sans-serif" font-size="10.8" font-weight="400" fill="#434853">纯底盘车自动回拨 P0 冗余核给感知规划</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">南北向通信契约全景: 84 项 ROS 2 + 5 大网关 vs SHM / SalWire v2 / SafetyFrame</title>
  <desc id="diagram-desc">完整呈现北向强类型 ROS 2 V2–V5 接口与 5 个 HTTP/WS 网关，对比南向无锁共享内存、SalWire v2 定长结构体与 32 字节 UDP 安全脉冲。</desc>
